[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "structgauge"
version = "1.1.0"
description = "Shelter and access: two one-sided, falsifiable spatial measures for voxel buildings"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Jen-Kai Lin", email = "kylelin0927@gmail.com" }]
dependencies = [
    # gmres(..., rtol=) is used in structgauge/core/field.py and needs >= 1.12;
    # on older scipy that keyword is `tol` and the call raises TypeError.
    "numpy>=1.20",
    "scipy>=1.12",
]

[tool.setuptools.packages.find]
include = ["structgauge*"]

[project.scripts]
structgauge = "structgauge.cli:main"

[project.urls]
Repository = "https://github.com/KyleLin0927/structgauge"
Dataset = "https://huggingface.co/datasets/jenkai-lin/VoxHouse3D"
Paper = "https://openreview.net/forum?id=qz1PLOrNPZ"

[tool.setuptools.package-data]
structgauge = ["report/*.json", "io/*.json"]
